services:
  dualsql:
    build: .
    image: dualsql:latest
    container_name: dualsql
    restart: unless-stopped
    ports:
      - "3000:3000"            # host:container — change the left side to publish elsewhere
    environment:
      # Bind inside the container (leave as-is; the published port above is what you hit).
      HOST: 0.0.0.0
      PORT: 3000
      QUERY_TIMEOUT_MS: 60000
      # DNS server serving your internal reverse (PTR) zone — see .env.example.
      RDNS_SERVERS: ${RDNS_SERVERS:-}

      # ── SQL Server default profile ──
      MSSQL_SERVER: ${MSSQL_SERVER:-host.docker.internal}
      MSSQL_USER: ${MSSQL_USER:-sa}
      MSSQL_PASSWORD: ${MSSQL_PASSWORD:-}
      MSSQL_TRUST_SERVER_CERT: ${MSSQL_TRUST_SERVER_CERT:-true}
      MSSQL_ENCRYPT: ${MSSQL_ENCRYPT:-false}
      # MSSQL_DEFAULT_DB:

      # ── PostgreSQL default profile ──
      PG_HOST: ${PG_HOST:-host.docker.internal}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-}
      # PG_DEFAULT_DB:
    volumes:
      - ./logs:/app/logs       # persist the per-query audit log on the host
    # host.docker.internal lets the container reach databases running on the host.
    # Native on Docker Desktop (Win/Mac); on Linux this maps it to the host gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
